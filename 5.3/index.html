<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>

    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        color: rgb(255, 255, 255);
        background-color: rgb(37, 35, 35);
    }
    h1 { 
        display: flex;
        color: maroon;
        padding: 20px;
        margin: 10px;
    }

    button {
        display: flex;
        padding: 10px;
        margin: 20px;
        border-radius: 5px;
        background-color: rgb(255, 0, 0);
        border: 5px;
        }

    button:hover{color: rgb(255, 255, 255);}

    input {
        border-radius: 5px;
        color: rgb(0, 0, 0)
    }




    </style>
    
</head>

<body>

    <h1 id="titulo">Site de ingressos esportivos</h1>

    <p class="texto">
        Site para comprar ingressos esportivos como volei, basquete, futebol dentro de todo rio de janeiro.
    </p>

    <img src="images.jpeg" alt="Descrição da imagem">

    <h2> Login para adiquirir os ingressos</h2>

    <form>
        <input type="text" placeholder="Nome"> <br>
        <input type="email" placeholder="E-mail"><br>
        <input type="password" placeholder="Senha">

        <button type="submit">Enviar</button>
    </form>

</body>

</html>
