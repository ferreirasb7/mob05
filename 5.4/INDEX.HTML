<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>

</head>

<body>

    <h1>Calculadora de IMC</h1>

    <label for="peso">Peso (kg):</label>
    <input type="number" id="peso" step="0.1">

    <br><br>

    <label for="altura">Altura (m):</label>
    <input type="number" id="altura" step="0.01">

    <br><br>

    <button onclick="calcularIMC()">Calcular IMC</button>

    <p id="resultado"></p>

    <script>
        function calcularIMC() {
            

            let peso = document.getElementById("peso").value;
            let altura = document.getElementById("altura").value;

        
            peso = parseFloat(peso);
            altura = parseFloat(altura);

            
            let imc = peso / (altura * altura);

            let resultado = document.getElementById("resultado");

           
            if (imc < 18.5) {
                resultado.textContent = "🔵 Abaixo do peso - IMC: " + imc.toFixed(2);
                resultado.className = "azul";

            } else if (imc < 25) {
                resultado.textContent = "🟢 Peso normal - IMC: " + imc.toFixed(2);
                resultado.className = "verde";

            } else if (imc < 30) {
                resultado.textContent = "🟡 Sobrepeso - IMC: " + imc.toFixed(2);
                resultado.className = "amarelo";

            } else {
                resultado.textContent = "🔴 Obesidade - IMC: " + imc.toFixed(2);
                resultado.className = "vermelho";
            }
        }
    </script>

</body>

</html>
